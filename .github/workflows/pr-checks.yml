name: PR checks

# Runs the same containerized checks CONTRIBUTING.md asks contributors to run,
# on GitHub-hosted runners so fork PRs never reach the self-hosted release runner.
on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, unit tests, headless GUI check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build the Fedora dev image once and cache its layers between runs;
      # compose then reuses the loaded tag instead of rebuilding it.
      - name: Build dev image (localhost/zalos-fedora:43)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: localhost/zalos-fedora:43
          load: true
          cache-from: type=gha,scope=zalos-fedora
          cache-to: type=gha,scope=zalos-fedora,mode=max

      - name: Build
        run: docker compose run --rm build

      - name: Unit tests
        run: docker compose run --rm test

      - name: Headless GUI check
        run: docker compose run --rm gui-check
