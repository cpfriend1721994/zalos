name: Base images (multiarch → GHCR)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.ubuntu'
      - 'Dockerfile.nix'

concurrency:
  group: base-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }} (${{ matrix.tag }})
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: zalos-ubuntu
            file: Dockerfile.ubuntu
            tag: 24.04
          - name: zalos-nix
            file: Dockerfile.nix
            tag: latest
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Use a job-private DOCKER_CONFIG
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - name: Lowercase owner (GHCR requires lowercase)
        id: base
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}:${{ matrix.tag }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.base.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
