name: Base images (multiarch → GHCR)

# Build-once, reuse-forever base images for the release matrix. These images hold ONLY the toolchain
# (Qt6/compilers on Fedora, Qt 6.4 on Ubuntu, Nix on nixos/nix) — never the Zalos source, which is bind-mounted
# at run time. They are built for linux/amd64 + linux/arm64 as a single manifest list and pushed to GHCR, so the
# packaging jobs in ci.yml just pull them and never rebuild the toolchain (the emulated arm64 toolchain install
# was the slow part). This workflow runs ONLY when a Dockerfile changes or it is dispatched by hand — a normal
# code push to main does not rebuild the bases.
#
# To refresh a base (new distro patch, added/updated dependency): edit the Dockerfile and push, or run this
# workflow manually (Actions → Base images → Run workflow). The floating tag (:43 / :24.04 / :latest) is overwritten.

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.ubuntu'
      - 'Dockerfile.nix'
      - '.github/workflows/base-images.yml'

concurrency:
  group: base-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }} (${{ matrix.tag }})
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: zalos-fedora
            file: Dockerfile
            tag: 43
          - name: zalos-ubuntu
            file: Dockerfile.ubuntu
            tag: 24.04
          - name: zalos-nix
            file: Dockerfile.nix
            tag: latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Lowercase owner (GHCR requires lowercase)
        id: base
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}:${{ matrix.tag }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.base.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
