name: Zalos CD Pipeline

# Release matrix (tests are NOT run here — the test suite runs locally; see the agent skills):
#   Fedora base (Dockerfile, FEDORA_VERSION=43)        -> RPM for Fedora 43+        (x86_64 + aarch64)
#   Ubuntu base (Dockerfile.ubuntu, 24.04 = Qt 6.4)    -> .deb (24.04+) and AppImage (x86_64 + aarch64)
#   nixos/nix   (newest nixos-unstable)                 -> Nix package              (x86_64 + aarch64)
#
# Each release ships SEPARATE x86_64 and aarch64 files (never a fat binary). aarch64 is built under QEMU/binfmt
# emulation on the x86_64 self-hosted runner, so it is slow: jobs run strictly one after another (each `needs`
# the previous, one global concurrency group) and within a job the x86_64 build finishes before the aarch64 one
# starts, so the runner never builds two trees at once.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Build every package without a tag (no GitHub release is published)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read # pull the prebuilt multiarch base images from ghcr.io (built once by base-images.yml)

jobs:
  release-gate:
    name: Release gate
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    outputs:
      is_release: ${{ steps.gate.outputs.is_release }}
    steps:
      - id: gate
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* || "${{ inputs.force_release }}" == "true" ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "🚀 Packaging enabled for ${{ github.ref_name }}"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Not a release: packaging is skipped"
          fi

  # ---------------------------------------------------------------------------------------------------------------
  # RPM (Fedora 43+), x86_64 then aarch64.
  # ---------------------------------------------------------------------------------------------------------------
  package-fedora:
    name: RPM (Fedora 43+, x86_64 + aarch64)
    needs: [release-gate]
    if: needs.release-gate.outputs.is_release == 'true'
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      # Job-private docker config dir: /root/.docker/config.json is a bind mount on the self-hosted runner, so
      # login-action's atomic rename over it fails with "device or resource busy". $RUNNER_TEMP is unique per job.
      - name: Use a job-private DOCKER_CONFIG
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No bind mounts in the packaging jobs. A runner whose docker daemon is remote or containerized cannot see
      # the job checkout, so `docker compose run` gets an empty /workspace and dies with
      # "bash: /workspace/packaging/...: No such file or directory" (exit 127). scripts/ci-package.sh moves the
      # source and the artifacts through the docker API instead: pull the prebuilt multiarch base (built once by
      # base-images.yml, never rebuilt here), COPY the source onto it (Dockerfile.app), run the packaging script,
      # copy /workspace/dist out. Each run is a fresh tree, so no build dir or stale artifact carries over.
      - name: Prebuilt base image (multiarch, from base-images.yml)
        run: echo "base_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zalos-fedora:43" >> "$GITHUB_ENV"
      - run: rm -rf dist
      - name: Pull base for amd64
        run: |
          docker pull --platform linux/amd64 "${base_image}"
          docker tag  "${base_image}" zalos-fedora:43-amd64
      - name: Build RPM (x86_64)
        run: bash scripts/ci-package.sh zalos-fedora:43-amd64 linux/amd64 packaging/rpm/build-rpm.sh
      - name: Enable aarch64 emulation (binfmt)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64 || true
      - name: Pull base for arm64
        run: |
          docker pull --platform linux/arm64 "${base_image}"
          docker tag  "${base_image}" zalos-fedora:43-arm64
      - name: Build RPM (aarch64, emulated)
        run: bash scripts/ci-package.sh zalos-fedora:43-arm64 linux/arm64 packaging/rpm/build-rpm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: zalos-rpm
          path: |
            dist/zalos-*.x86_64.rpm
            dist/zalos-*.aarch64.rpm
          if-no-files-found: error
      - name: Reclaim disk (unused images + layer/build cache)
        if: always()
        run: |
          docker image prune -f || true
          docker builder prune -af || true

  # ---------------------------------------------------------------------------------------------------------------
  # .deb (Ubuntu 24.04+) and AppImage, x86_64 then aarch64.
  # ---------------------------------------------------------------------------------------------------------------
  package-ubuntu:
    name: .deb + AppImage (x86_64 + aarch64)
    needs: [release-gate, package-fedora]
    if: needs.release-gate.outputs.is_release == 'true'
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      # Job-private docker config dir (see the RPM job): avoids the bind-mounted /root/.docker/config.json rename EBUSY.
      - name: Use a job-private DOCKER_CONFIG
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Prebuilt Ubuntu base (Qt 6.4) from GHCR; the source is baked on top of it per target (see the RPM job).
      - name: Prebuilt base image (multiarch, from base-images.yml)
        run: echo "base_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zalos-ubuntu:24.04" >> "$GITHUB_ENV"
      - run: rm -rf dist
      - name: Pull base for amd64
        run: |
          docker pull --platform linux/amd64 "${base_image}"
          docker tag  "${base_image}" zalos-ubuntu:24.04-amd64
      - name: Build .deb + AppImage (x86_64)
        run: |
          bash scripts/ci-package.sh zalos-ubuntu:24.04-amd64 linux/amd64 "bash packaging/deb/build-deb.sh && bash packaging/appimage/build-appimage.sh"
      - name: Enable aarch64 emulation (binfmt)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64 || true
      - name: Pull base for arm64
        run: |
          docker pull --platform linux/arm64 "${base_image}"
          docker tag  "${base_image}" zalos-ubuntu:24.04-arm64
      - name: Build .deb + AppImage (aarch64, emulated)
        run: |
          bash scripts/ci-package.sh zalos-ubuntu:24.04-arm64 linux/arm64 "bash packaging/deb/build-deb.sh && bash packaging/appimage/build-appimage.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: zalos-deb-appimage
          path: |
            dist/zalos_*.deb
            dist/Zalos-*.AppImage
          if-no-files-found: error
      - name: Reclaim disk (unused images + layer/build cache)
        if: always()
        run: |
          docker image prune -f || true
          docker builder prune -af || true

  # ---------------------------------------------------------------------------------------------------------------
  # Nix (nixos-unstable), x86_64 then aarch64.
  # ---------------------------------------------------------------------------------------------------------------
  package-nix:
    name: Nix (x86_64 + aarch64)
    needs: [release-gate, package-ubuntu]
    if: needs.release-gate.outputs.is_release == 'true'
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      # Job-private docker config dir (see the RPM job): avoids the bind-mounted /root/.docker/config.json rename EBUSY.
      - name: Use a job-private DOCKER_CONFIG
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: rm -rf dist
      # The nix base pins nixos/nix with flakes pre-enabled (see Dockerfile.nix). Only the native x86_64 step refreshes
      # flake.lock; the emulated aarch64 step reuses that exact lockfile without running `nix flake update` under QEMU.
      - name: Prebuilt base image (multiarch, from base-images.yml)
        run: echo "base_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zalos-nix:latest" >> "$GITHUB_ENV"
      - name: Build Nix package (x86_64, against the newest nixos-unstable)
        run: |
          docker pull --platform linux/amd64 "${base_image}"
          docker tag  "${base_image}" zalos-nix:latest-amd64
          bash scripts/ci-package.sh zalos-nix:latest-amd64 linux/amd64 packaging/nix/build-nix.sh
      - name: Enable aarch64 emulation (binfmt)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64 || true
      - name: Build Nix package (aarch64, emulated)
        run: |
          docker pull --platform linux/arm64 "${base_image}"
          docker tag  "${base_image}" zalos-nix:latest-arm64
          bash scripts/ci-package.sh zalos-nix:latest-arm64 linux/arm64 packaging/nix/build-nix.sh
      - uses: actions/upload-artifact@v7
        with:
          name: zalos-nix
          path: dist/zalos-*-nixos.tar.gz
          if-no-files-found: error
      - name: Reclaim disk (unused images + layer/build cache)
        if: always()
        run: |
          docker image prune -f || true
          docker builder prune -af || true

  # ---------------------------------------------------------------------------------------------------------------
  # GitHub release (tags only): every package (x86_64 + aarch64) + SHA256SUMS.
  # Release notes are a curated, English changelog built from CHANGELOG.md (scripts/ci-release-notes.sh),
  # not GitHub's auto-generated commit dump — see the "## [X.Y.Z]" section for this tag.
  # ---------------------------------------------------------------------------------------------------------------
  release:
    name: GitHub release
    needs: [package-nix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags, so CHANGELOG.md is present and the compare link resolves
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: SHA256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Build release notes from CHANGELOG.md
        run: bash scripts/ci-release-notes.sh "${GITHUB_REF_NAME}" release-notes.md
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Zalos ${{ github.ref_name }}
          files: release/*
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
