name: Zalos CD Pipeline

# Release matrix (tests are NOT run here — the test suite runs locally; see the agent skills):
#   Fedora base (Dockerfile, FEDORA_VERSION=43)        -> RPM for Fedora 43+        (x86_64 + aarch64)
#   Ubuntu base (Dockerfile.ubuntu, 24.04 = Qt 6.4)    -> .deb (24.04+) and AppImage (x86_64 + aarch64)
#   nixos/nix   (newest nixos-unstable)                 -> Nix package              (x86_64 + aarch64)
#
# Each release ships SEPARATE x86_64 and aarch64 files (never a fat binary). aarch64 is built under QEMU/binfmt
# emulation on the x86_64 self-hosted runner, so it is slow: jobs run strictly one after another (each `needs`
# the previous, one global concurrency group) and within a job the x86_64 build finishes before the aarch64 one
# starts, so the runner never builds two trees at once.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Build every package without a tag (no GitHub release is published)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-gate:
    name: Release gate
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    outputs:
      is_release: ${{ steps.gate.outputs.is_release }}
    steps:
      - id: gate
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* || "${{ inputs.force_release }}" == "true" ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "🚀 Packaging enabled for ${{ github.ref_name }}"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Not a release: packaging is skipped"
          fi

  # ---------------------------------------------------------------------------------------------------------------
  # RPM (Fedora 43+), x86_64 then aarch64.
  # ---------------------------------------------------------------------------------------------------------------
  package-fedora:
    name: RPM (Fedora 43+, x86_64 + aarch64)
    needs: [release-gate]
    if: needs.release-gate.outputs.is_release == 'true'
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - run: rm -rf dist /tmp/rpmbuild && docker compose build package-rpm
      - name: Build RPM (x86_64)
        run: docker compose run --rm package-rpm
      - name: Enable aarch64 emulation (binfmt)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64 || true
      - name: Clean build trees before the aarch64 build
        run: docker compose run --rm --entrypoint rm package-rpm -rf /workspace/build /tmp/rpmbuild || true
      - name: Build RPM (aarch64, emulated)
        run: docker compose build package-rpm-arm64 && docker compose run --rm package-rpm-arm64
      - name: Fix artifact ownership
        run: docker compose run --rm --entrypoint chown package-rpm -R "$(id -u):$(id -g)" /workspace/dist || true
      - uses: actions/upload-artifact@v4
        with:
          name: zalos-rpm
          path: |
            dist/zalos-*.x86_64.rpm
            dist/zalos-*.aarch64.rpm
            dist/zalos-*.src.rpm
          if-no-files-found: error
      - name: Reclaim disk (unused images + layer/build cache)
        if: always()
        run: |
          docker image prune -f || true
          docker builder prune -af || true

  # ---------------------------------------------------------------------------------------------------------------
  # .deb (Ubuntu 24.04+) and AppImage, x86_64 then aarch64.
  # ---------------------------------------------------------------------------------------------------------------
  package-ubuntu:
    name: .deb + AppImage (x86_64 + aarch64)
    needs: [release-gate, package-fedora]
    if: needs.release-gate.outputs.is_release == 'true'
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - run: rm -rf dist build-deb build-appimage && docker compose build package-deb package-appimage
      - name: Build .deb + AppImage (x86_64)
        run: |
          docker compose run --rm package-deb
          docker compose run --rm package-appimage
      - name: Enable aarch64 emulation (binfmt)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64 || true
      - name: Clean build trees before the aarch64 build
        run: docker compose run --rm --entrypoint rm package-deb -rf /workspace/build-deb /workspace/build-appimage || true
      - name: Build .deb + AppImage (aarch64, emulated)
        run: |
          docker compose build package-deb-arm64 package-appimage-arm64
          docker compose run --rm package-deb-arm64
          docker compose run --rm package-appimage-arm64
      - name: Fix artifact ownership
        run: docker compose run --rm --entrypoint chown package-deb -R "$(id -u):$(id -g)" /workspace/dist || true
      - uses: actions/upload-artifact@v4
        with:
          name: zalos-deb-appimage
          path: |
            dist/zalos_*.deb
            dist/Zalos-*.AppImage
          if-no-files-found: error
      - name: Reclaim disk (unused images + layer/build cache)
        if: always()
        run: |
          docker image prune -f || true
          docker builder prune -af || true

  # ---------------------------------------------------------------------------------------------------------------
  # Nix (nixos-unstable), x86_64 then aarch64.
  # ---------------------------------------------------------------------------------------------------------------
  package-nix:
    name: Nix (x86_64 + aarch64)
    needs: [release-gate, package-ubuntu]
    if: needs.release-gate.outputs.is_release == 'true'
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - run: rm -rf dist
      - name: Build Nix package (x86_64, updates flake.lock to the newest nixos-unstable)
        run: docker compose run --rm package-nix
      - name: Enable aarch64 emulation (binfmt)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64 || true
      - name: Build Nix package (aarch64, emulated)
        run: docker compose run --rm package-nix-arm64
      - name: Fix artifact ownership
        run: docker compose run --rm --entrypoint chown package-nix -R "$(id -u):$(id -g)" /workspace/dist || true
      - uses: actions/upload-artifact@v4
        with:
          name: zalos-nix
          path: dist/zalos-*-nixos.tar.gz
          if-no-files-found: error
      - name: Reclaim disk (unused images + layer/build cache)
        if: always()
        run: |
          docker image prune -f || true
          docker builder prune -af || true

  # ---------------------------------------------------------------------------------------------------------------
  # GitHub release (tags only): every package (x86_64 + aarch64) + SHA256SUMS.
  # ---------------------------------------------------------------------------------------------------------------
  release:
    name: GitHub release
    needs: [package-nix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: SHA256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
