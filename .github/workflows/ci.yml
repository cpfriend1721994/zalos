name: Zalos CD Pipeline

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Build every package without a tag (no GitHub release is published)'
        required: false
        type: boolean
        default: false
      publish_repo:
        description: 'Publish APT & RPM repo from the latest GitHub Release to GitHub Pages'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  release-gate:
    name: Release gate
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    outputs:
      is_release: ${{ steps.gate.outputs.is_release }}
    steps:
      - id: gate
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* || "${{ inputs.force_release }}" == "true" ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "🚀 Packaging enabled for ${{ github.ref_name }}"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Not a release: packaging is skipped"
          fi

  package:
    name: ${{ matrix.target }}
    needs: [release-gate]
    if: needs.release-gate.outputs.is_release == 'true'
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: ubuntu-x86_64
            base_path: zalos-ubuntu:24.04
            platform: linux/amd64
            build: "bash packaging/deb/build-deb.sh && bash packaging/appimage/build-appimage.sh && bash packaging/rpm/build-rpm-prebuilt.sh"
            wrap: 'yes'
          - target: ubuntu-aarch64
            base_path: zalos-ubuntu:24.04
            platform: linux/arm64
            build: "bash packaging/deb/build-deb.sh && bash packaging/appimage/build-appimage.sh && bash packaging/rpm/build-rpm-prebuilt.sh"
            wrap: 'yes'
          - target: nix-x86_64
            base_path: zalos-nix:latest
            platform: linux/amd64
            build: packaging/nix/build-nix.sh
            wrap: 'no'
          - target: nix-aarch64
            base_path: zalos-nix:latest
            platform: linux/arm64
            build: packaging/nix/build-nix.sh
            wrap: 'no'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Drop artifacts of a previous run on a reused runner
        run: rm -rf dist
      - name: Restore a package already built for this commit
        id: cache
        uses: actions/cache@v4
        with:
          path: dist
          key: zalos-pkg-${{ matrix.target }}-${{ github.sha }}
      - name: Use a job-private DOCKER_CONFIG
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prebuilt base image (multiarch, from base-images.yml)
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "base_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.base_path }}" >> "$GITHUB_ENV"
      - name: Pull base for ${{ matrix.platform }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pulled=0
          for attempt in 1 2 3 4 5; do
            if docker pull --platform "${{ matrix.platform }}" "${base_image}"; then
              pulled=1
              break
            fi
            echo "==> docker pull failed (attempt ${attempt}), retrying..."
            sleep $((attempt * 10))
          done
          if [ "${pulled}" != "1" ]; then
            echo "❌ Could not pull ${base_image} for ${{ matrix.platform }}"
            exit 1
          fi
          docker tag "${base_image}" "zalos-base-${{ matrix.target }}"
      - name: Enable aarch64 emulation (binfmt)
        if: matrix.platform == 'linux/arm64' && steps.cache.outputs.cache-hit != 'true'
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64 || true
      - name: Build ${{ matrix.target }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/ci-package.sh "zalos-base-${{ matrix.target }}" "${{ matrix.platform }}" "${{ matrix.build }}"
      - name: Cross-package AppImages on the host (container fallback)
        if: matrix.wrap == 'yes' && steps.cache.outputs.cache-hit != 'true'
        run: |
          mapfile -t ARCHIVES < <(ls dist/Zalos-*-AppDir.tar.gz 2>/dev/null || true)
          if [ "${#ARCHIVES[@]}" -gt 0 ]; then
            echo "==> Cross-packaging ${#ARCHIVES[@]} AppDir bundle(s) into AppImages..."
            mkdir -p /tmp/tools/bin
            if ! command -v file &>/dev/null; then
              echo "==> Setting up file utility shim for appimagetool..."
              cp scripts/file-shim.sh /tmp/tools/bin/file
              chmod +x /tmp/tools/bin/file
              (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends file) 2>/dev/null || true
            fi
            export PATH="/tmp/tools/bin:$PATH"
            TOOL="/tmp/tools/appimagetool-x86_64"
            if [ ! -f "${TOOL}" ]; then
              curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
                -o "${TOOL}" "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
              chmod +x "${TOOL}"
            fi
            for ARCHIVE in "${ARCHIVES[@]}"; do
              case "${ARCHIVE}" in
                *-x86_64-AppDir.tar.gz) TARGET_ARCH=x86_64 ;;
                *-aarch64-AppDir.tar.gz) TARGET_ARCH=aarch64 ;;
                *) echo "❌ Unknown architecture in ${ARCHIVE}"; exit 1 ;;
              esac
              APPDIR=$(mktemp -d)
              tar -xzf "${ARCHIVE}" -C "${APPDIR}"
              OUT="${ARCHIVE%-AppDir.tar.gz}.AppImage"
              echo "==> ${TARGET_ARCH}: ${ARCHIVE} -> ${OUT}"
              UPDATE_INFO="gh-releases-zsync|cpfriend1721994|zalos|latest|Zalos-*-${TARGET_ARCH}.AppImage.zsync"
              ARCH="${TARGET_ARCH}" "${TOOL}" --appimage-extract-and-run -n \
                -u "${UPDATE_INFO}" \
                --comp zstd --mksquashfs-opt -Xcompression-level --mksquashfs-opt 22 --mksquashfs-opt -b --mksquashfs-opt 1M \
                "${APPDIR}" "${OUT}"
              ZSYNC_LOCAL="$(basename "${OUT}").zsync"
              [ -f "${ZSYNC_LOCAL}" ] && mv -f "${ZSYNC_LOCAL}" "$(dirname "${OUT}")/"
              rm -rf "${APPDIR}" "${ARCHIVE}"
            done
          fi
      - name: Verify ${{ matrix.target }} produced its files
        run: |
          ls -lh dist/
          case "${{ matrix.target }}" in
            ubuntu-*) ls dist/Zalos-*.AppImage dist/zalos_*.deb dist/zalos-*.rpm ;;
            nix-*)    ls dist/zalos-*-nixos.tar.gz ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          overwrite: true
      - name: Reclaim disk (unused images + layer/build cache)
        if: always()
        run: |
          docker image prune -f || true
          docker builder prune -af || true

  release:
    name: GitHub release
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Verify version matches tag
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          CMAKE_VER=$(sed -n 's/^[[:space:]]*project(zalos VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)
          if [ "${CMAKE_VER}" != "${TAG_VER}" ]; then
            echo "Version mismatch: CMakeLists.txt=${CMAKE_VER}, tag=${TAG_VER}" >&2
            exit 1
          fi
      - name: SHA256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Build release notes from CHANGELOG.md
        run: bash scripts/ci-release-notes.sh "${GITHUB_REF_NAME}" release-notes.md
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Zalos ${{ github.ref_name }}
          files: release/*
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-repo:
    name: Publish APT & RPM repo
    needs: [release]
    if: ${{ always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.publish_repo)) }}
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Download .deb and .rpm release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf repo-pkgs _repo
          mkdir -p repo-pkgs
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            gh release download "${{ github.ref_name }}" -p '*.deb' -p '*.rpm' -D repo-pkgs --clobber
          else
            gh release download -p '*.deb' -p '*.rpm' -D repo-pkgs --clobber
          fi
          ls -lh repo-pkgs/
      - name: Build and sign APT & RPM repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          GPG_KEY_HOST="${RUNNER_TEMP}/zalos-gpg.key"
          GPG_PASS_HOST="${RUNNER_TEMP}/zalos-gpg.pass"
          (
            umask 077
            printf '%s\n' "${GPG_PRIVATE_KEY}" > "${GPG_KEY_HOST}"
            printf '%s' "${GPG_PASSPHRASE}" > "${GPG_PASS_HOST}"
          )
          CID=""
          cleanup() {
            rm -f "${GPG_KEY_HOST}" "${GPG_PASS_HOST}"
            [ -n "${CID}" ] && docker rm -f "${CID}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          CID=$(docker create \
            -e GPG_PRIVATE_KEY_FILE=/tmp/zalos-gpg.key \
            -e GPG_PASSPHRASE_FILE=/tmp/zalos-gpg.pass \
            ubuntu:24.04 bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends dpkg-dev apt-utils createrepo-c rpm gnupg ca-certificates
              bash /tmp/scripts/build-pkg-repo.sh /tmp/repo-pkgs /tmp/_repo
              rm -f /tmp/zalos-gpg.key /tmp/zalos-gpg.pass
            ")
          docker cp "${GITHUB_WORKSPACE}/scripts" "${CID}:/tmp/scripts"
          docker cp "${GITHUB_WORKSPACE}/repo-pkgs" "${CID}:/tmp/repo-pkgs"
          docker cp "${GPG_KEY_HOST}" "${CID}:/tmp/zalos-gpg.key"
          docker cp "${GPG_PASS_HOST}" "${CID}:/tmp/zalos-gpg.pass"
          docker start -a "${CID}"
          docker cp "${CID}:/tmp/_repo" "${GITHUB_WORKSPACE}/_repo"
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_repo'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-snap:
    name: Publish Snap (version-synced)
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check Snapcraft credentials
        id: creds
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -n "${SNAPCRAFT_STORE_CREDENTIALS}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SNAPCRAFT_STORE_CREDENTIALS not set — skipping Store upload (Launchpad uses snap/snapcraft.yaml override-pull)."
          fi
      - name: Build Snap
        if: steps.creds.outputs.enabled == 'true'
        id: snapcraft
        uses: snapcore/action-build@v1
      - name: Publish Snap to stable
        if: steps.creds.outputs.enabled == 'true'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable

  sync-flatpak:
    name: Sync Flatpak manifest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Check Flathub token
        id: flathub
        env:
          FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
        run: |
          if [ -n "${FLATHUB_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "FLATHUB_TOKEN not set — Flathub x-checker-data bot will pick up tag ${GITHUB_REF_NAME}."
          fi
      - name: Open Flathub update PR
        if: steps.flathub.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh repo clone flathub/io.github.cpfriend1721994.zalos flathub-repo
          cd flathub-repo
          git checkout -b "update-${TAG_NAME}"
          sed -i "s/tag: v.*/tag: ${TAG_NAME}/" io.github.cpfriend1721994.zalos.yml
          sed -i "s/commit: [0-9a-f]*/commit: ${COMMIT_SHA}/" io.github.cpfriend1721994.zalos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add io.github.cpfriend1721994.zalos.yml
          git commit -m "Update to ${TAG_NAME}" || exit 0
          git push -u origin "update-${TAG_NAME}" --force
          gh pr create --title "Update to ${TAG_NAME}" --body "Automated update for ${TAG_NAME} (${COMMIT_SHA})." || true
