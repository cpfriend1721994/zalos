name: Zalos CD Pipeline

# Release matrix (tests are NOT run here — the test suite runs locally; see the agent skills):
#   rpm-*     Fedora 43 base (Dockerfile)           -> RPM for Fedora 43+            (x86_64 + aarch64)
#   ubuntu-*  Ubuntu 24.04 base (Dockerfile.ubuntu) -> .deb (24.04+) and AppImage     (x86_64 + aarch64)
#   nix-*     nixos/nix (newest nixos-unstable)     -> Nix package                   (x86_64 + aarch64)
#
# Every target is its own matrix leg and the legs run strictly one at a time (max-parallel: 1): the aarch64 legs
# build under QEMU/binfmt on the x86_64 self-hosted runner and saturate it, so two builds must never overlap.
# Separate legs make a failure per target: GitHub's "Re-run failed jobs" repeats only the failed leg and the
# release job, while the legs that already finished keep their artifacts from the same run.
#
# Each leg also caches its finished dist/ under the commit SHA ("Restore a package already built for this
# commit"). "Re-run all jobs" on the same commit then restores the packages that were already built instead of
# rebuilding them, while a new commit always rebuilds — the SHA in the key makes a stale artifact impossible.
# Network hops that used to fail a release on their own (GHCR pull, appimagetool download) are retried in place.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Build every package without a tag (no GitHub release is published)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read # pull the prebuilt multiarch base images from ghcr.io (built once by base-images.yml)

jobs:
  release-gate:
    name: Release gate
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    outputs:
      is_release: ${{ steps.gate.outputs.is_release }}
    steps:
      - id: gate
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* || "${{ inputs.force_release }}" == "true" ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "🚀 Packaging enabled for ${{ github.ref_name }}"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Not a release: packaging is skipped"
          fi

  # ---------------------------------------------------------------------------------------------------------------
  # Six release targets, one per matrix leg, serialized by max-parallel: 1.
  # ---------------------------------------------------------------------------------------------------------------
  package:
    name: ${{ matrix.target }}
    needs: [release-gate]
    if: needs.release-gate.outputs.is_release == 'true'
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    strategy:
      fail-fast: false # run the remaining targets: their artifacts are kept for a "Re-run failed jobs"
      max-parallel: 1 # never two builds at once: one emulated build saturates the runner
      matrix:
        include:
          - target: rpm-x86_64
            base_path: zalos-fedora:43
            platform: linux/amd64
            build: packaging/rpm/build-rpm.sh
            wrap: 'no'
          - target: rpm-aarch64
            base_path: zalos-fedora:43
            platform: linux/arm64
            build: packaging/rpm/build-rpm.sh
            wrap: 'no'
          - target: ubuntu-x86_64
            base_path: zalos-ubuntu:24.04
            platform: linux/amd64
            build: "bash packaging/deb/build-deb.sh && bash packaging/appimage/build-appimage.sh"
            wrap: 'yes'
          - target: ubuntu-aarch64
            base_path: zalos-ubuntu:24.04
            platform: linux/arm64
            build: "bash packaging/deb/build-deb.sh && bash packaging/appimage/build-appimage.sh"
            wrap: 'yes'
          - target: nix-x86_64
            base_path: zalos-nix:latest
            platform: linux/amd64
            build: packaging/nix/build-nix.sh
            wrap: 'no'
          # Only the native x86_64 leg refreshes flake.lock to the newest nixos-unstable; the emulated aarch64 leg
          # reuses the committed lock (build-nix.sh skips `nix flake update` when ZALOS_EMULATED=1).
          - target: nix-aarch64
            base_path: zalos-nix:latest
            platform: linux/arm64
            build: packaging/nix/build-nix.sh
            wrap: 'no'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Drop artifacts of a previous run on a reused runner
        run: rm -rf dist
      # Only a successful leg stores its dist/; a failed one has no cache entry and therefore rebuilds from
      # scratch, while every target that already shipped is restored in seconds.
      - name: Restore a package already built for this commit
        id: cache
        uses: actions/cache@v4
        with:
          path: dist
          key: zalos-pkg-${{ matrix.target }}-${{ github.sha }}
      # Job-private docker config dir: /root/.docker/config.json is a bind mount on the self-hosted runner, so
      # login-action's atomic rename over it fails with "device or resource busy". $RUNNER_TEMP is unique per job.
      - name: Use a job-private DOCKER_CONFIG
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No bind mounts in the packaging legs. A runner whose docker daemon is remote or containerized cannot see
      # the job checkout, so `docker compose run` gets an empty /workspace and dies with
      # "bash: /workspace/packaging/...: No such file or directory" (exit 127). scripts/ci-package.sh moves the
      # source and the artifacts through the docker API instead: pull the prebuilt multiarch base (built once by
      # base-images.yml, never rebuilt here), COPY the source onto it (Dockerfile.app), run the packaging script,
      # copy /workspace/dist out.
      - name: Prebuilt base image (multiarch, from base-images.yml)
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "base_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.base_path }}" >> "$GITHUB_ENV"
      # GHCR occasionally answers a manifest request with a 5xx or a reset connection: five spaced attempts turn a
      # registry hiccup into a retry instead of a red job.
      - name: Pull base for ${{ matrix.platform }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pulled=0
          for attempt in 1 2 3 4 5; do
            if docker pull --platform "${{ matrix.platform }}" "${base_image}"; then
              pulled=1
              break
            fi
            echo "==> docker pull failed (attempt ${attempt}), retrying..."
            sleep $((attempt * 10))
          done
          if [ "${pulled}" != "1" ]; then
            echo "❌ Could not pull ${base_image} for ${{ matrix.platform }}"
            exit 1
          fi
          docker tag "${base_image}" "zalos-base-${{ matrix.target }}"
      - name: Enable aarch64 emulation (binfmt)
        if: matrix.platform == 'linux/arm64' && steps.cache.outputs.cache-hit != 'true'
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64 || true
      - name: Build ${{ matrix.target }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/ci-package.sh "zalos-base-${{ matrix.target }}" "${{ matrix.platform }}" "${{ matrix.build }}"
      # A container whose docker has no outbound network cannot download appimagetool, and the foreign-arch
      # container cannot execute it at all. Any AppDir bundle is therefore wrapped here with the arch-matched tool
      # from the runner, so a container-side failure can never block the release.
      - name: Cross-package AppImages on the host (container fallback)
        if: matrix.wrap == 'yes' && steps.cache.outputs.cache-hit != 'true'
        run: |
          mapfile -t ARCHIVES < <(ls dist/Zalos-*-AppDir.tar.gz 2>/dev/null || true)
          if [ "${#ARCHIVES[@]}" -gt 0 ]; then
            echo "==> Cross-packaging ${#ARCHIVES[@]} AppDir bundle(s) into AppImages..."
            mkdir -p /tmp/tools/bin
            if ! command -v file &>/dev/null; then
              echo "==> Setting up file utility shim for appimagetool..."
              cp scripts/file-shim.sh /tmp/tools/bin/file
              chmod +x /tmp/tools/bin/file
              (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends file) 2>/dev/null || true
            fi
            export PATH="/tmp/tools/bin:$PATH"
            TOOL="/tmp/tools/appimagetool-x86_64"
            if [ ! -f "${TOOL}" ]; then
              curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
                -o "${TOOL}" "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
              chmod +x "${TOOL}"
            fi
            for ARCHIVE in "${ARCHIVES[@]}"; do
              case "${ARCHIVE}" in
                *-x86_64-AppDir.tar.gz) TARGET_ARCH=x86_64 ;;
                *-aarch64-AppDir.tar.gz) TARGET_ARCH=aarch64 ;;
                *) echo "❌ Unknown architecture in ${ARCHIVE}"; exit 1 ;;
              esac
              APPDIR=$(mktemp -d)
              tar -xzf "${ARCHIVE}" -C "${APPDIR}"
              OUT="${ARCHIVE%-AppDir.tar.gz}.AppImage"
              echo "==> ${TARGET_ARCH}: ${ARCHIVE} -> ${OUT}"
              ARCH="${TARGET_ARCH}" "${TOOL}" --appimage-extract-and-run -n "${APPDIR}" "${OUT}"
              rm -rf "${APPDIR}" "${ARCHIVE}"
            done
          fi
      # A packaging script that silently falls back (e.g. an AppDir tarball instead of an AppImage) must fail here,
      # not in `release`. Runs on a cache hit too, so a restored leg is verified as well.
      - name: Verify ${{ matrix.target }} produced its files
        run: |
          ls -lh dist/
          case "${{ matrix.target }}" in
            rpm-*)    ls dist/zalos-*.rpm ;;
            ubuntu-*) ls dist/Zalos-*.AppImage dist/zalos_*.deb ;;
            nix-*)    ls dist/zalos-*-nixos.tar.gz ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          overwrite: true # a re-run of the same leg replaces the artifact instead of failing on a 409
      - name: Reclaim disk (unused images + layer/build cache)
        if: always()
        run: |
          docker image prune -f || true
          docker builder prune -af || true

  # ---------------------------------------------------------------------------------------------------------------
  # GitHub release (tags only): every package (x86_64 + aarch64) + SHA256SUMS.
  # Release notes are a curated, English changelog built from CHANGELOG.md (scripts/ci-release-notes.sh),
  # not GitHub's auto-generated commit dump — see the "## [X.Y.Z]" section for this tag.
  # A leg that failed leaves this job skipped, so a partial release is never published.
  # ---------------------------------------------------------------------------------------------------------------
  release:
    name: GitHub release
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags, so CHANGELOG.md is present and the compare link resolves
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: SHA256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Build release notes from CHANGELOG.md
        run: bash scripts/ci-release-notes.sh "${GITHUB_REF_NAME}" release-notes.md
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Zalos ${{ github.ref_name }}
          files: release/*
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
