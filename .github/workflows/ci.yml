name: Zalos CI/CD Pipeline

# Release matrix (keep in sync with .agents/skills/04-packaging-infrastructure, "Release matrix"):
#   Fedora base   (Dockerfile, FEDORA_VERSION=43, oldest maintained Fedora)  -> tests, RPM for Fedora 43+
#   Ubuntu base   (Dockerfile.ubuntu, Ubuntu 24.04 = Qt 6.4, oldest Qt)       -> Qt 6.4 tests, .deb and AppImage
#   nixos/nix     (Nix's own toolchain, newest nixos-unstable)                 -> Nix package
#   archlinux     (clean rolling image, makepkg from source with PKGBUILD)     -> Arch package + PKGBUILD
# Every package is installed on the oldest and the newest release it targets before it is published.
# Jobs run strictly one after another (each `needs` the previous one, one global concurrency group) so the
# self-hosted runner never builds two images or trees at once; each job deletes its build tree when done.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Build and test every package without a tag (no GitHub release)'
        required: false
        type: boolean
        default: false

concurrency:
  # One run at a time on the runner (disk/CPU); a newer push of the same ref cancels the older run.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------------------------------------------
  # Tests on both bases: the newest supported Qt we build with (Fedora) and the oldest one (Ubuntu 24.04, Qt 6.4).
  # ---------------------------------------------------------------------------------------------------------------
  test-fedora:
    name: Tests (Fedora base, Qt 6.10)
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Build Fedora toolchain image
        run: docker compose build test gui-check
      - name: CTest (unit, system, QML AOT gate)
        run: |
          rm -rf build
          docker compose run --rm -w /workspace test bash -c \
            "cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON && cmake --build build --parallel \$(nproc) && cd build && ctest --output-on-failure"
      - name: Headless GUI check (Xvfb)
        run: docker compose run --rm gui-check
      - name: Free disk (build trees)
        if: always()
        run: docker compose run --rm --entrypoint rm package-rpm -rf /workspace/build || true


  test-ubuntu:
    name: Tests (Ubuntu 24.04 base, Qt 6.4)
    needs: [test-fedora]
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Build Ubuntu toolchain image
        run: docker compose build build-ubuntu
      - name: CTest on the oldest supported Qt
        run: |
          rm -rf build-ubuntu
          docker compose run --rm build-ubuntu
      - name: Free disk (build trees)
        if: always()
        run: docker compose run --rm --entrypoint rm package-rpm -rf /workspace/build-ubuntu || true
      - name: Drop dangling image layers
        if: always()
        run: docker image prune -f || true


  release-gate:
    name: Release gate
    needs: [test-ubuntu]
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    outputs:
      is_release: ${{ steps.gate.outputs.is_release }}
    steps:
      - id: gate
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* || "${{ inputs.force_release }}" == "true" ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "🚀 Packaging enabled for ${{ github.ref_name }}"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Not a release: packages are skipped"
          fi

  # ---------------------------------------------------------------------------------------------------------------
  # Packages (one job per base), each installed on the oldest and newest release it targets.
  # ---------------------------------------------------------------------------------------------------------------
  package-fedora:
    name: RPM (Fedora 43+)
    needs: [release-gate]
    if: needs.release-gate.outputs.is_release == 'true'
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - run: rm -rf dist /tmp/rpmbuild && docker compose build package-rpm
      - name: Build RPM
        run: docker compose run --rm package-rpm
      - name: Clean install on the oldest and newest Fedora
        run: |
          docker compose run --rm test-fedora-rpm
          docker compose run --rm test-fedora-rpm-latest
      - name: Fix artifact ownership
        run: docker compose run --rm --entrypoint chown package-rpm -R "$(id -u):$(id -g)" /workspace/dist || true
      - uses: actions/upload-artifact@v4
        with:
          name: zalos-rpm
          path: |
            dist/zalos-*.x86_64.rpm
            dist/zalos-*.src.rpm
          if-no-files-found: error


  package-ubuntu:
    name: .deb (Ubuntu 24.04+) and AppImage
    needs: [release-gate, package-fedora]
    if: needs.release-gate.outputs.is_release == 'true'
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - run: rm -rf dist build-deb build-appimage && docker compose build package-deb package-appimage test-appimage
      - name: Build .deb
        run: docker compose run --rm package-deb
      - name: Clean install of the .deb on the oldest and newest Ubuntu
        run: |
          docker compose run --rm test-deb-ubuntu2404
          docker compose run --rm test-deb-ubuntu-latest
      - name: Build AppImage
        run: docker compose run --rm package-appimage
      - name: Run the AppImage on the Fedora base (different distro, newer Qt)
        run: docker compose run --rm test-appimage
      - name: Fix artifact ownership
        run: docker compose run --rm --entrypoint chown package-deb -R "$(id -u):$(id -g)" /workspace/dist || true
      - uses: actions/upload-artifact@v4
        with:
          name: zalos-deb-appimage
          path: |
            dist/zalos_*.deb
            dist/Zalos-*.AppImage
          if-no-files-found: error
      - name: Free disk (build trees)
        if: always()
        run: docker compose run --rm --entrypoint rm package-rpm -rf /workspace/build-deb /workspace/build-appimage || true


  package-arch:
    name: Arch Linux (makepkg from source)
    needs: [release-gate, package-ubuntu]
    if: needs.release-gate.outputs.is_release == 'true'
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - run: rm -rf dist && docker compose pull package-arch
      - name: Build with makepkg (packaging/arch/PKGBUILD)
        run: docker compose run --rm package-arch
      - name: Clean install with pacman and GUI check
        run: docker compose run --rm test-arch
      - name: Fix artifact ownership
        run: docker compose run --rm --entrypoint chown package-arch -R "$(id -u):$(id -g)" /workspace/dist || true
      - name: Ship the PKGBUILD next to the package
        run: cp packaging/arch/PKGBUILD dist/PKGBUILD
      - uses: actions/upload-artifact@v4
        with:
          name: zalos-arch
          path: |
            dist/zalos-*-x86_64.pkg.tar.zst
            dist/PKGBUILD
          if-no-files-found: error

  package-nix:
    name: Nix (nixos-unstable)
    needs: [release-gate, package-arch]
    if: needs.release-gate.outputs.is_release == 'true'
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - run: rm -rf dist
      - name: Build Nix package (updates flake.lock to the newest nixos-unstable)
        run: docker compose run --rm package-nix
      - name: Fix artifact ownership
        run: docker compose run --rm --entrypoint chown package-nix -R "$(id -u):$(id -g)" /workspace/dist || true
      - uses: actions/upload-artifact@v4
        with:
          name: zalos-nix
          path: dist/zalos-*-nixos.tar.gz
          if-no-files-found: error
      - name: Drop dangling image layers
        if: always()
        run: docker image prune -f || true

  # ---------------------------------------------------------------------------------------------------------------
  # GitHub release (tags only): all packages + SHA256SUMS.
  # ---------------------------------------------------------------------------------------------------------------
  release:
    name: GitHub release
    needs: [package-nix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64, tunnm-cicd]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: SHA256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

