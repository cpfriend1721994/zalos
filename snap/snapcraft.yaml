name: zalos
base: core24
adopt-info: zalos
summary: Lightweight native Qt6 desktop client for Zalo on Linux
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:
  armhf:
  riscv64:

apps:
  zalos:
    command: usr/bin/zalos
    extensions: [gnome]
    common-id: io.github.cpfriend1721994.zalos
    desktop: usr/share/applications/zalos.desktop
    environment:
      QT_PLUGIN_PATH: $SNAP/usr/lib/x86_64-linux-gnu/qt6/plugins:$SNAP/usr/lib/aarch64-linux-gnu/qt6/plugins:$SNAP/usr/lib/arm-linux-gnueabihf/qt6/plugins:$SNAP/usr/lib/riscv64-linux-gnu/qt6/plugins
      QML_IMPORT_PATH: $SNAP/usr/lib/x86_64-linux-gnu/qt6/qml:$SNAP/usr/lib/aarch64-linux-gnu/qt6/qml:$SNAP/usr/lib/arm-linux-gnueabihf/qt6/qml:$SNAP/usr/lib/riscv64-linux-gnu/qt6/qml
      QML2_IMPORT_PATH: $SNAP/usr/lib/x86_64-linux-gnu/qt6/qml:$SNAP/usr/lib/aarch64-linux-gnu/qt6/qml:$SNAP/usr/lib/arm-linux-gnueabihf/qt6/qml:$SNAP/usr/lib/riscv64-linux-gnu/qt6/qml
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu/pulseaudio:$SNAP/usr/lib/aarch64-linux-gnu/pulseaudio:$SNAP/usr/lib/arm-linux-gnueabihf/pulseaudio:$SNAP/usr/lib/riscv64-linux-gnu/pulseaudio
    plugs:
      - network
      - network-bind
      - audio-playback
      - audio-record
      - camera
      - home
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - removable-media
      - password-manager-service

parts:
  zalos:
    plugin: cmake
    source: .
    override-pull: |
      craftctl default
      VER=$(sed -n 's/^[[:space:]]*project(zalos VERSION \([0-9.]*\).*/\1/p' "$CRAFT_PART_SRC/CMakeLists.txt" | head -n1)
      if [ -n "$VER" ]; then
        craftctl set version="$VER"
      fi
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DBUILD_TESTING=OFF
      - -DZALOS_QML_AOT=ON
    build-packages:
      - pkg-config
      - qt6-base-dev
      - qt6-base-dev-tools
      - qt6-declarative-dev
      - qt6-declarative-dev-tools
      - qt6-svg-dev
      - qt6-wayland-dev
      - qt6-websockets-dev
      - qt6-multimedia-dev
      - qt6-shadertools-dev
      - libgl-dev
      - libssl-dev
      - liblzma-dev
      - zlib1g-dev
      - libsqlite3-dev
      - libzstd-dev
      - libopenh264-dev
    stage-packages:
      - libqt6core6t64
      - libqt6gui6t64
      - libqt6qml6
      - libqt6quick6
      - libqt6quickcontrols2-6
      - libqt6network6t64
      - libqt6dbus6t64
      - libqt6svg6
      - libqt6sql6t64
      - libqt6sql6-sqlite
      - libqt6websockets6
      - libqt6multimedia6
      - qt6-qpa-plugins
      - qt6-wayland
      - qt6-image-formats-plugins
      - qt6-xdgdesktopportal-platformtheme
      - qml6-module-qtquick
      - qml6-module-qtquick-controls
      - qml6-module-qtquick-layouts
      - qml6-module-qtquick-templates
      - qml6-module-qtquick-window
      - qml6-module-qtquick-shapes
      - qml6-module-qtqml-workerscript
      - qml6-module-qtmultimedia
      - qml6-module-qtcore
      - libopenh264-7
      - libopus0
      - libpulse0
      - libzstd1
    parse-info:
      - usr/share/metainfo/io.github.cpfriend1721994.zalos.metainfo.xml
