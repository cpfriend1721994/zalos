services:
  build:
    image: localhost/zalos-fedora:43
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    command: >
      bash -c "
        mkdir -p build &&
        cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON &&
        cmake --build build --parallel $$(nproc)
      "

  test:
    image: localhost/zalos-fedora:43
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:z
    working_dir: /workspace/build
    environment:
      - QT_QPA_PLATFORM=offscreen
    command: >
      bash -c "
        if [ ! -f CTestTestfile.cmake ]; then
          cmake -B /workspace/build -S /workspace -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON &&
          cmake --build /workspace/build --parallel $$(nproc)
        fi &&
        ctest --output-on-failure
      "

  package-rpm:
    image: localhost/zalos-ubuntu:24.04
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    environment:
      - HOME=/tmp
    command: bash -c "bash /workspace/packaging/deb/build-deb.sh && bash /workspace/packaging/rpm/build-rpm-prebuilt.sh"

  package-rpm-source:
    image: localhost/zalos-fedora:43
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    command: bash /workspace/packaging/rpm/build-rpm.sh

  package-appimage:
    image: localhost/zalos-ubuntu:24.04
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    environment:
      - HOME=/tmp
    command: bash /workspace/packaging/appimage/build-appimage.sh

  package-nix:
    image: docker.io/nixos/nix:latest
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    environment:
      - NIX_CONFIG=experimental-features = nix-command flakes
    command: bash /workspace/packaging/nix/build-nix.sh

  gui-check:
    image: localhost/zalos-fedora:43
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    environment:
      - DISPLAY=:99
      - QT_QPA_PLATFORM=offscreen
    command: >
      bash -c "
        if [ ! -f /workspace/build/zalos ]; then
          cmake -B /workspace/build -S /workspace -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF &&
          cmake --build /workspace/build --parallel $$(nproc)
        fi &&
        xvfb-run -a /workspace/build/zalos --test-gui &&
        echo '✅ Headless GUI execution sanity check passed.'
      "

  test-fedora-rpm:
    image: docker.io/library/fedora:43
    user: "0:0"
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    command: bash /workspace/scripts/test-fedora-rpm.sh

  test-fedora-rpm-latest:
    image: docker.io/library/fedora:45
    user: "0:0"
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    command: bash /workspace/scripts/test-fedora-rpm.sh

  test-fedora-gui:
    image: localhost/zalos-fedora:43
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:z
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/bus:/run/host-session-bus:ro
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_QPA_PLATFORM=xcb
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/host-session-bus
      - IBUS_USE_PORTAL=1
      - QT_IM_MODULE=${QT_IM_MODULE:-ibus}
      - XMODIFIERS=${XMODIFIERS:-@im=ibus}
    command: >
      bash -c "
        if [ ! -f /workspace/build/zalos ]; then
          cmake -B /workspace/build -S /workspace -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF &&
          cmake --build /workspace/build --parallel $$(nproc)
        fi &&
        /workspace/build/zalos
      "

  test-appimage:
    image: localhost/zalos-fedora:43
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    command: bash /workspace/scripts/test-appimage.sh

  test-appimage-gui:
    image: localhost/zalos-fedora:43
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:z
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/bus:/run/host-session-bus:ro
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_QPA_PLATFORM=xcb
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/host-session-bus
      - IBUS_USE_PORTAL=1
      - QT_IM_MODULE=${QT_IM_MODULE:-ibus}
      - XMODIFIERS=${XMODIFIERS:-@im=ibus}
    command: >
      bash -c "
        APPIMAGE_FILE=$$(ls /workspace/dist/Zalos-*.AppImage 2>/dev/null | head -n 1)
        if [ -z \"$${APPIMAGE_FILE}\" ]; then
          bash /workspace/packaging/appimage/build-appimage.sh
          APPIMAGE_FILE=$$(ls /workspace/dist/Zalos-*.AppImage 2>/dev/null | head -n 1)
        fi
        \"$${APPIMAGE_FILE}\" --appimage-extract-and-run
      "

  test-nix:
    image: docker.io/nixos/nix:latest
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    environment:
      - NIX_CONFIG=experimental-features = nix-command flakes
    command: bash /workspace/scripts/test-nix.sh

  test-nix-shell:
    image: docker.io/nixos/nix:latest
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    environment:
      - NIX_CONFIG=experimental-features = nix-command flakes
    command: nix develop --extra-experimental-features "nix-command flakes"

  build-ubuntu:
    image: localhost/zalos-ubuntu:24.04
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    environment:
      - HOME=/tmp
    command: >
      bash -c "
        cmake -B build-ubuntu -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON &&
        cmake --build build-ubuntu --parallel $$(nproc) &&
        cd build-ubuntu && ctest --output-on-failure
      "

  package-deb:
    image: localhost/zalos-ubuntu:24.04
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    environment:
      - HOME=/tmp
    command: bash /workspace/packaging/deb/build-deb.sh

  test-deb-ubuntu2404:
    image: docker.io/library/ubuntu:24.04
    user: "0:0"
    volumes:
      - .:/workspace:z
    command: bash /workspace/scripts/test-deb.sh

  test-deps-deb:
    image: docker.io/library/ubuntu:24.04
    user: "0:0"
    volumes:
      - .:/workspace:z
    environment:
      - TARGET=deb
    command: bash /workspace/scripts/test-deps.sh

  test-deps-rpm:
    image: docker.io/library/fedora:43
    user: "0:0"
    volumes:
      - .:/workspace:z
    environment:
      - TARGET=rpm
    command: bash /workspace/scripts/test-deps.sh

  test-deps-appimage-ubuntu2204:
    image: docker.io/library/ubuntu:22.04
    user: "0:0"
    volumes:
      - .:/workspace:z
    environment:
      - TARGET=appimage
    command: bash /workspace/scripts/test-deps.sh

  test-deps-appimage-debian12:
    image: docker.io/library/debian:12
    user: "0:0"
    volumes:
      - .:/workspace:z
    environment:
      - TARGET=appimage
    command: bash /workspace/scripts/test-deps.sh

  test-deps-appimage-arch:
    image: docker.io/library/archlinux:latest
    user: "0:0"
    volumes:
      - .:/workspace:z
    environment:
      - TARGET=appimage
    command: bash /workspace/scripts/test-deps.sh

  test-deps-appimage-opensuse:
    image: docker.io/opensuse/tumbleweed:latest
    user: "0:0"
    volumes:
      - .:/workspace:z
    environment:
      - TARGET=appimage
    command: bash /workspace/scripts/test-deps.sh

  test-deb-ubuntu-latest:
    image: docker.io/library/ubuntu:rolling
    user: "0:0"
    volumes:
      - .:/workspace:z
    command: bash /workspace/scripts/test-deb.sh

  package-rpm-arm64:
    image: localhost/zalos-fedora-arm64:43
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    command: bash /workspace/packaging/rpm/build-rpm.sh

  package-appimage-arm64:
    image: localhost/zalos-ubuntu-arm64:24.04
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
      platforms:
        - linux/arm64
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    environment:
      - HOME=/tmp
    command: bash /workspace/packaging/appimage/build-appimage.sh

  package-deb-arm64:
    image: localhost/zalos-ubuntu-arm64:24.04
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
      platforms:
        - linux/arm64
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    environment:
      - HOME=/tmp
    command: bash /workspace/packaging/deb/build-deb.sh

  package-nix-arm64:
    image: docker.io/nixos/nix:latest
    platform: linux/arm64
    volumes:
      - .:/workspace:z
    working_dir: /workspace
    environment:
      - NIX_CONFIG=experimental-features = nix-command flakes
      - ZALOS_EMULATED=1
    command: bash /workspace/packaging/nix/build-nix.sh
