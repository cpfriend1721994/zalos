<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Nền xanh Zalo nguyên bản (Gradient chuyển sắc) -->
    <linearGradient id="zalosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080FF"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>

    <!-- Clip path: Chữ Z vát & bo cong chuẩn Zalo -->
    <clipPath id="zSilhouette">
      <path d="M 154.39,170.83 L 154.39,126.00 L 363.59,126.00 L 363.59,132.38 C 363.59,144.28 362.00,153.99 354.27,165.38 L 353.34,166.45 C 351.65,168.37 347.69,172.86 345.81,175.30 L 211.36,344.16 L 363.59,344.16 L 363.59,368.07 C 363.59,377.97 355.56,386.00 345.65,386.00 L 148.41,386.00 L 148.41,374.73 C 148.41,360.92 151.84,354.76 156.18,348.34 L 299.50,170.83 L 154.39,170.83 Z"/>
    </clipPath>
  </defs>

  <!-- NỀN TRÒN MỞ RỘNG TOÀN DIỆN (Circle r=256px, chuẩn phong cách Telegram) -->
  <circle cx="256" cy="256" r="256" fill="url(#zalosBg)"/>

  <!-- Chữ Z Origami: chuẩn form typography Zalo, các mảng nếp gấp phân sắc hài hòa -->
  <g clip-path="url(#zSilhouette)">
    <!-- [KHỐI 1] Nửa trên nét ngang trên: TRẮNG SÁNG -->
    <polygon points="154.39,126.00 363.59,126.00 331.54,148.42 154.39,148.42" fill="#FFFFFF"/>

    <!-- [KHỐI 2] Nửa dưới nét ngang trên: TRẮNG BÓNG ORIGAMI -->
    <polygon points="154.39,148.42 331.54,148.42 299.50,170.83 154.39,170.83" fill="#E5EFFC"/>

    <!-- [KHỐI 3] Nửa phải thân chéo trung tâm: TRẮNG SÁNG -->
    <polygon points="363.59,126.00 370.00,180.00 211.36,344.16 179.89,365.08 331.54,148.42" fill="#FFFFFF"/>

    <!-- [KHỐI 4] Nửa trái thân chéo trung tâm: 100% TRẮNG BÓNG ORIGAMI -->
    <polygon points="299.50,170.83 331.54,148.42 179.89,365.08 148.41,386.00 140.00,340.00" fill="#E5EFFC"/>

    <!-- [KHỐI 5] Nửa trên nét ngang dưới: TRẮNG BÓNG ORIGAMI -->
    <polygon points="211.36,344.16 370.00,344.16 370.00,365.08 179.89,365.08" fill="#E5EFFC"/>

    <!-- [KHỐI 6] Nửa dưới nét ngang dưới: TRẮNG SÁNG -->
    <polygon points="148.41,386.00 179.89,365.08 370.00,365.08 370.00,390.00 148.41,390.00" fill="#FFFFFF"/>

    <!-- === CÁC ĐƯỜNG NÉT GẤP PHÂN LẬP GIỮA CÁC KHỐI === -->
    <!-- 1. Nét giữa thanh ngang trên -->
    <line x1="154.39" y1="148.42" x2="331.54" y2="148.42" stroke="#B4CBE5" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 2. Nét gập góc phải-trên -->
    <line x1="363.59" y1="126.00" x2="299.50" y2="170.83" stroke="#B4CBE5" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 3. Nét sống giữa thân chéo -->
    <line x1="331.54" y1="148.42" x2="179.89" y2="365.08" stroke="#B4CBE5" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 4. Nét gập góc trái-dưới -->
    <line x1="148.41" y1="386.00" x2="211.36" y2="344.16" stroke="#B4CBE5" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 5. Nét giữa thanh ngang dưới -->
    <line x1="179.89" y1="365.08" x2="363.59" y2="365.08" stroke="#B4CBE5" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
